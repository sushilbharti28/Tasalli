  appearance:
    tablet: '[{colour_primary} ][{shape} ]ট্যাবলেট[, {size}][, {marking}]'
    capsule: '[{colour_primary} ]ক্যাপসুল[, {size}]'
    capsule_two_colour: 'আধা {colour_primary}, আধা {colour_secondary} ক্যাপসুল[, {size}]'
  pack:
    strip: '{pack_colour} পাতায়'
    strip_with_print: '{pack_colour} পাতায়, {print_colour} লেখা'
    loose: 'কৌটোয় খোলা রাখা'
    bottle: '{pack_colour} বোতলে'
