# Both Devanagari and Roman forms: speech engines return either.
# Nukta and chandrabindu/anusvara are ignored when matching (README), so नहीं = नही.
replies:
  confirm: ['ले ली', 'ले लिया', 'ले ली है', 'ले लिया है', 'लेली', 'हाँ', 'हां', 'हा', 'हाँ जी', 'हाँ ले ली', 'खा ली', 'खा लिया', 'हो गया', 'लिली', 'लीली', 'ली ली', 'लेलिया', 'yes', 'le li', 'le liya', 'le li hai', 'leli', 'le lee', 'lelee', 'leliya', 'lily', 'lili', 'li li', 'haan', 'haa', 'han', 'haan ji', 'haan le li', 'kha li', 'kha liya', 'ho gaya']
  # "Not taken". Also "ran out" words (ख़त्म, khatam): "dawai khatam ho gayi" must never count as taken.
  negative: ['नहीं', 'नहीं ली', 'नहीं लिया', 'नहीं खाई', 'अभी नहीं', 'ख़त्म', 'nahi', 'nahin', 'nai', 'nahi li', 'nahi liya', 'abhi nahi', 'khatam', 'khatm', 'no']
  snooze: ['बाद में', 'थोड़ी देर में', 'थोड़ी देर बाद', 'रुको', 'baad mein', 'baad me', 'thodi der mein', 'thodi der baad', 'ruko']
  repeat: ['फिर से', 'दोबारा', 'समझ नहीं आया', 'क्या', 'क्या बोला', 'phir se', 'dobara', 'samajh nahi aaya', 'kya', 'kya bola']
  doctor_changed: ['डॉक्टर ने बदली', 'डॉक्टर ने बदल दी', 'डॉक्टर ने बंद की', 'डॉक्टर ने बंद कर दी', 'दवाई बदल गई', 'doctor ne badli', 'doctor ne badal di', 'doctor ne band ki', 'doctor ne band kar di', 'dawai badal gayi']
  unwell: ['तबीयत ख़राब', 'तबियत ख़राब', 'तबीयत ठीक नहीं', 'तबियत ठीक नहीं', 'tabiyat kharab', 'tabiyat theek nahi', 'tabiyat thik nahi']
  stop: ['बंद करो', 'फ़ोन मत करो', 'मत करो फ़ोन', 'फ़ोन बंद करो', 'band karo', 'phone mat karo', 'mat karo phone', 'phone band karo', 'stop']
  consent_yes: ['हाँ', 'हाँ जी', 'ठीक है', 'हाँ ठीक है', 'haan', 'haa', 'han', 'haan ji', 'theek hai', 'thik hai', 'yes', 'ok']
  consent_no: ['नहीं', 'नहीं चाहिए', 'मत करो', 'nahi', 'nahin', 'nahi chahiye', 'mat karo', 'no']
