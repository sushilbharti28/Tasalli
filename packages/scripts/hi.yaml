# NEEDS NATIVE-SPEAKER REVIEW (Hindi). Not approved for real calls until the founder signs off.
# Tasalli call script: Hindi (hi). Same keys as en.yaml. Format: see README.md.
# {name} = value, {name|f} = gendered form (m, f, obl), [ ... ] = optional segment.
# Rules: bolchaal ki Hindi, chhote vaakya, "aap" aur "ji". Koi dawai ki salaah ya daawa nahi.
# Written in Devanagari for the TTS voice. docs/call-scripts.md has the same lines in Roman Hindi.

meta:
  language: hi
  name: हिन्दी
  version: 1
  review_status: needs_native_speaker_review
  approved_by: null
  approved_on: null
  reviewer_notes:
    - 'गोली स्त्रीलिंग, कैप्सूल पुल्लिंग माना है; रंग और आकार के शब्द इसी हिसाब से हैं। जाँच लें।'
    - '"पत्ता" (strip) docs/call-scripts.md से लिया है; रविवार वाली लाइन में "पत्ती" है। एक शब्द चुन लें।'
    - 'नकारात्मक सूची में "ना" जानबूझकर नहीं है: "ले ली ना" का मतलब "ले ली" होता है।'

templates:
  consent:
    ask: 'नमस्ते {person_name} जी। यह तसल्ली की तरफ़ से फ़ोन है। {relation_phrase} {child_name} आपको दवाई की याद दिलाने के लिए फ़ोन करवाना चाहते हैं। यह कॉल रिकॉर्ड की जाएगी। अगर आप हाँ कहना चाहते हैं, तो "हाँ" बोलिए, या 1 दबाइए। अगर आप ये फ़ोन नहीं चाहते, तो 9 दबाइए। फिर हम कभी फ़ोन नहीं करेंगे।'
    agreed: 'धन्यवाद जी। अब दवाई के समय पर हम फ़ोन करेंगे। हर बार "ले ली" या "हाँ" बोलिए, या 1 दबाइए। कभी भी 9 दबाकर फ़ोन बंद करवा सकते हैं। नमस्ते।'
    declined: 'ठीक है जी। हम आपको फ़ोन नहीं करेंगे। नमस्ते।'
    stopped: 'ठीक है जी। अब हम आपको कभी फ़ोन नहीं करेंगे। नमस्ते।'
    unclear: 'माफ़ कीजिए, समझ नहीं आया। हाँ कहना हो, तो 1 दबाइए। फ़ोन नहीं चाहिए, तो 9 दबाइए।'
    no_answer_goodbye: 'जवाब नहीं मिला। नमस्ते।'

  reminder_full:
    greeting: 'नमस्ते {person_name} जी, {child_name} की तरफ़ से दवाई का समय।'
    count_one: 'अभी एक दवाई लेनी है।'
    count_many: 'अभी {count} दवाइयाँ लेनी हैं।'
    item: '{ordinal}, {spoken_name}: {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}]।[ {food_phrase}।][ {extra_instruction}]'
    ask: 'दवाई ले लें, फिर बोलिए "ले ली" या "हाँ", या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए। पंद्रह मिनट बाद याद दिलाने के लिए 2।'
    more_options: 'डॉक्टर ने दवाई बदली हो, तो 3 दबाइए।'

  reminder_short:
    single: '{person_name} जी, {spoken_name} का समय। {amount_text}[, {food_phrase}]। ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'
    group_greeting: '{person_name} जी, दवाई का समय।'
    group_item: '{spoken_name}: {amount_text}[, {food_phrase}]।'
    ask: 'ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'

  test_call:
    intro: 'यह तसल्ली की टेस्ट कॉल है। आपके घर वालों को ऐसी ही कॉल आएगी।'

  repeat:
    intro: 'फिर से सुनिए।'

  unclear:
    first: 'माफ़ कीजिए, समझ नहीं आया। फिर से बोलिए।'
    keypad: 'दवाई ले ली हो, तो 1 दबाइए। बाद में याद दिलाने के लिए 2। दोबारा सुनने के लिए 0।'
    final: 'जवाब नहीं मिला। नमस्ते।'

  reply_ack:
    confirmed: 'धन्यवाद जी। {child_name} को बता देंगे। नमस्ते।'
    snoozed: 'ठीक है जी। पंद्रह मिनट बाद फिर याद दिलाएँगे। नमस्ते।'
    snooze_used_up: 'पंद्रह मिनट वाली याद एक ही बार होती है। दवाई ले लें, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए।'
    not_taken: 'ठीक है जी। दवाई ले लें, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। पंद्रह मिनट बाद याद दिलाने के लिए 2 दबाइए।'
    doctor_changed: 'ठीक है जी। {child_name} को बता देंगे कि डॉक्टर ने दवाई बदली है। नमस्ते।'
    unwell: 'ठीक है जी। {child_name} को बता देंगे। ज़रूरत हो, तो अपने डॉक्टर से बात कीजिए। नमस्ते।'
    stop: 'ठीक है जी। अब हम आपको कभी फ़ोन नहीं करेंगे। {child_name} को भी बता देंगे। नमस्ते।'
    goodbye: 'नमस्ते।'

  sunday:
    new_strip: '{spoken_name} की नई पत्ती खोली हो, तो उस पर {number} लिख दीजिए।'

# Lines the call engine needs that the sections above do not cover (see README, "Call engine format").
engine_extra:
  child_fallback: 'आपके परिवार'   # said when the account holder gave no name
  list_and: ' और '
  declined_ack: 'ठीक है जी। {child_name} को बता देंगे। नमस्ते।'   # not taken and the 15 minute reminder already used

# One medicine at a time (call engine v1.3): the call goes through the due medicines in order and confirms each one.
# {ordinal} already says "medicine" (see blocks.ordinals). Not in the other languages yet: the engine falls back to its built-in lines.
reminder_steps:
  # Variables (reminder lines never name the child; {relation_phrase} {child_name} are for the consent call): {person_name} {meal_phrase} {count_word} {count} {ordinal} {strip_name} {strength} {spoken_line} {spoken_name} {amount_text}
  # {appearance_phrase} {pack_phrase} {disambiguator} {extra_instruction}. {ordinal} already says "medicine" (blocks.ordinals).
  # The food timing is said once in the intro ({meal_phrase}), so the item lines leave it out. A call only groups doses with the same food timing.
  greeting: 'नमस्ते {person_name} जी।'
  # Presence check, asked right after the greeting and before any medicine (network lag and drops are common): any yes or key continues; it is never a dose confirmation.
  presence: 'क्या आपको आवाज़ आ रही है? "हाँ" बोलिए, या 1 दबाइए।'
  spoken_line: 'जिसे आप {spoken_name} कहते हैं।'
  intro_many: 'आपकी {meal_phrase} वाली {count_word} दवाइयों का समय हो गया है। एक-एक करके बताते हैं।'
  intro_one: 'आपकी {meal_phrase} वाली दवाई का समय हो गया है।'
  short_intro_many: 'आपकी {meal_phrase} वाली {count_word} दवाइयों का समय हो गया है। एक-एक करके बताते हैं।'
  short_intro_one: 'आपकी {meal_phrase} वाली दवाई का समय हो गया है।'
  item: '{ordinal}: {strip_name} {strength}। {spoken_line} {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}]।[ {extra_instruction}।] ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'
  item_one: 'दवाई: {strip_name} {strength}। {spoken_line} {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}]।[ {extra_instruction}।] ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'
  item_short: '{ordinal}: {strip_name} {strength}। {spoken_line} {amount_text}[, {disambiguator}]।[ {extra_instruction}।] ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'
  item_short_one: 'दवाई: {strip_name} {strength}। {spoken_line} {amount_text}[, {disambiguator}]।[ {extra_instruction}।] ले ली हो, तो "ले ली" या "हाँ" बोलिए, या 1 दबाइए। दोबारा सुनने के लिए "फिर से" बोलिए, या 0 दबाइए।'
  # {meal_phrase} = meal + relation (dose hour: before 11 breakfast, 11-16 lunch, after 16 dinner); with no food rule, the day part.
  meals: { breakfast: 'नाश्ते', lunch: 'दोपहर के खाने', dinner: 'रात के खाने' }
  food_rel: { before: 'से पहले', after: 'के बाद', with: 'के साथ' }
  day_part: { morning: 'सुबह की', afternoon: 'दोपहर की', evening: 'शाम की', night: 'रात की' }
  relations: { son: 'आपके बेटे', daughter: 'आपकी बेटी', grandson: 'आपके पोते', granddaughter: 'आपकी पोती', daughter_in_law: 'आपकी बहू', son_in_law: 'आपके दामाद' }
  count_words: ['एक', 'दो', 'तीन', 'चार', 'पाँच', 'छह', 'सात', 'आठ', 'नौ', 'दस']
  ack_next: 'ठीक है।'
  ack_not_now: 'कोई बात नहीं, थोड़ी देर में फिर याद दिलाएँगे।'
  ack_silence: 'कोई बात नहीं।'
  unclear: 'माफ़ कीजिए, समझ नहीं आया। ले ली हो, तो 1 दबाइए।'
  all_done: 'बहुत अच्छा। सब दवाइयाँ ले ली गई हैं। धन्यवाद।'
  all_done_one: 'बहुत अच्छा। दवाई ले ली गई है। धन्यवाद।'
  some_left: 'धन्यवाद। बाकी दवाई के लिए थोड़ी देर में फिर फ़ोन करेंगे।'
  some_left_one: 'धन्यवाद। दवाई के लिए थोड़ी देर में फिर फ़ोन करेंगे।'
  # A medicine heard 3 times (repeated twice) stays unconfirmed and the call moves on; soft call time limit reached.
  repeat_limit: 'कोई बात नहीं, आगे बढ़ते हैं।'
  time_up: 'समय पूरा हो गया। बाकी दवाई के लिए थोड़ी देर में फिर फ़ोन करेंगे। धन्यवाद।'

