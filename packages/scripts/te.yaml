  appearance:
    tablet: '[{colour_primary} ][{shape} ]మాత్ర[, {size}][, {marking}]'
    capsule: '[{colour_primary} ]క్యాప్సూల్[, {size}]'
    capsule_two_colour: 'సగం {colour_primary}, సగం {colour_secondary} క్యాప్సూల్[, {size}]'
