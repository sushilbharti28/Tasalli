  confirm: ['వేసుకున్నాను', 'వేసుకున్నా', 'తీసుకున్నాను', 'తాగాను', 'అవును', 'అవును వేసుకున్నాను', 'yes', 'vesukunnanu', 'vesukunna', 'teesukunnanu', 'tagaanu', 'avunu']
