  snooze: ['తర్వాత', 'కాసేపాగి', 'కొంచెం సేపటి తర్వాత', 'tarvata', 'taruvata', 'kaasepaagi']
  repeat: ['మళ్ళీ', 'మళ్ళీ చెప్పండి', 'అర్థం కాలేదు', 'ఏమిటి', 'ఏంటి', 'malli', 'malli cheppandi', 'artham kaaledu', 'enti']
