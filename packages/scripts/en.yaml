# NEEDS NATIVE-SPEAKER REVIEW (Indian English, for elderly listeners). Not approved for real calls.
# Tasalli call script: English (en). Canonical key set: every language file has exactly these keys.
# Format: see README.md. {name} = value, {name|f} = gendered form, [ ... ] = optional segment.
# Rules: plain spoken words, short sentences. No medical advice or claims. Family text is spoken as entered.

meta:
  language: en
  name: English
  version: 1
  review_status: needs_native_speaker_review   # set to 'approved' only with founder sign-off
  approved_by: null
  approved_on: null
  reviewer_notes:
    - 'Indian English for older listeners. "Namaste ... ji" kept on purpose; change if it sounds wrong.'
    - 'Keys are said as digits ("press 1"). Check that the TTS voice reads them clearly.'

templates:
  consent:
    ask: 'Namaste {person_name} ji. This is a call from Tasalli. This call will be recorded. {child_name} wants us to call you at medicine time, to remind you. To say yes, say "yes", or press 1. If you do not want these calls, press 9. Then we will never call again.'
    agreed: 'Thank you. We will call you at medicine time. Each time, say "taken", or press 1. You can press 9 at any time to stop the calls. Namaste.'
    declined: 'Okay. We will not call you. Namaste.'
    stopped: 'Okay. We will never call you again. Namaste.'
    unclear: 'Sorry, I did not understand. To say yes, press 1. If you do not want these calls, press 9.'
    no_answer_goodbye: 'We did not get an answer. Namaste.'

  reminder_full:
    greeting: 'Namaste {person_name} ji. It is medicine time. {child_name} asked us to remind you.'
    count_one: 'You have one medicine to take now.'
    count_many: 'You have {count} medicines to take now.'
    item: '{ordinal}, {spoken_name}: {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}].[ {food_phrase}.][ {extra_instruction}]'
    ask: 'Take your medicine, then say "taken", or press 1. To hear it again, press 0. To be reminded in fifteen minutes, press 2.'
    more_options: 'If the doctor changed your medicine, press 3.'

  reminder_short:
    single: '{person_name} ji, time for {spoken_name}. {amount_text}[, {food_phrase}]. When you have taken it, say "taken", or press 1.'
    group_greeting: '{person_name} ji, it is medicine time.'
    group_item: '{spoken_name}: {amount_text}[, {food_phrase}].'
    ask: 'When you have taken them, say "taken", or press 1.'

  test_call:
    intro: 'This is a Tasalli test call. Your family member will hear a call like this.'

  repeat:
    intro: 'Listen again.'

  unclear:
    first: 'Sorry, I did not understand. Please say it again.'
    keypad: 'If you have taken the medicine, press 1. To be reminded later, press 2. To hear it again, press 0.'
    final: 'We did not get an answer. Namaste.'

  reply_ack:
    confirmed: 'Thank you. We will tell {child_name}. Namaste.'
    snoozed: 'Okay. We will remind you again in fifteen minutes. Namaste.'
    snooze_used_up: 'The fifteen minute reminder is only once. When you take the medicine, say "taken", or press 1.'
    not_taken: 'Okay. When you take the medicine, say "taken", or press 1. To be reminded in fifteen minutes, press 2.'
    doctor_changed: 'Okay. We will tell {child_name} that the doctor changed the medicine. Namaste.'
    unwell: 'Okay. We will tell {child_name}. If you need, please talk to your doctor. Namaste.'
    stop: 'Okay. We will never call you again. We will tell {child_name} too. Namaste.'
    goodbye: 'Namaste.'

  sunday:
    new_strip: 'If you opened a new strip of {spoken_name}, please write {number} on it.'

# Lines the call engine needs that the sections above do not cover (see README, "Call engine format").
engine_extra:
  child_fallback: 'your family'   # said when the account holder gave no name
  list_and: ' and '
  declined_ack: 'All right. We will let {child_name} know. Goodbye.'   # not taken and the 15 minute reminder already used

# One medicine at a time (call engine v1.3). {ordinal} already says "medicine" (see blocks.ordinals).
reminder_steps:
  intro_many: 'Namaste {person_name} ji. It is medicine time. {child_name} asked us to remind you. You have {count} medicines to take now. We will go one by one.'
  intro_one: 'Namaste {person_name} ji. It is medicine time. {child_name} asked us to remind you. You have one medicine to take now.'
  short_intro_many: '{person_name} ji, it is medicine time. You have {count} medicines to take now. We will go one by one.'
  item: '{ordinal}: {spoken_name}. {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}].[ {food_phrase}.][ {extra_instruction}.] Please take this medicine. When you have taken it, say "taken", or press 1.'
  item_one: 'Medicine: {spoken_name}. {amount_text}[, {appearance_phrase}][, {pack_phrase}][, {disambiguator}].[ {food_phrase}.][ {extra_instruction}.] Please take this medicine. When you have taken it, say "taken", or press 1.'
  item_short: '{ordinal}: {spoken_name}. {amount_text}[, {disambiguator}].[ {food_phrase}.][ {extra_instruction}.] When you have taken it, say "taken", or press 1.'
  # Words for {time_of_day} (parent's local hour). {time_of_day} and {meal_relation} (set only when every medicine shares the food rule) can be used in any line here.
  time_of_day: { morning: 'morning', afternoon: 'afternoon', evening: 'evening', night: 'night' }
  ack_next: 'All right.'
  ack_not_now: 'No problem, we will remind you again in a little while.'
  ack_silence: 'No problem.'
  unclear: 'Sorry, I did not understand. If you have taken it, press 1.'
  all_done: 'Very good. All the medicines have been taken. Thank you.'
  all_done_one: 'Very good. The medicine has been taken. Thank you.'
  some_left: 'Thank you. We will call again in a little while for the remaining medicine.'
  some_left_one: 'Thank you. We will call again in a little while for the medicine.'

building:
  appearance:
    tablet: '[{colour_primary} ][{shape} ]tablet[, {size}][, {marking}]'
    capsule: '[{colour_primary} ]capsule[, {size}]'
    capsule_two_colour: 'half {colour_primary}, half {colour_secondary} capsule[, {size}]'
  pack:
    strip: 'in the {pack_colour} strip'
    strip_with_print: 'in the {pack_colour} strip with {print_colour} writing'
    loose: 'kept loose in a box'
    bottle: 'in the {pack_colour} bottle'
    bottle_with_cap: 'in the {pack_colour} bottle {cap_phrase}'
    cap_phrase: 'with the {cap_colour} cap'
  disambiguator:
    number: 'the one marked number {number}'
    printed_name: 'the strip that says {strip_name_spelled}'

blocks:
  colours:
    white: 'white'
    cream: 'cream'
    yellow: 'yellow'
    orange: 'orange'
    pink: 'pink'
    red: 'red'
    maroon: 'dark red'
    brown: 'brown'
    green: 'green'
    blue: 'blue'
    purple: 'purple'
    grey: 'grey'
    black: 'black'
    silver: 'silver'
    golden: 'golden'
    transparent: 'clear glass'
  shapes:
    round: 'round'
    oval: 'oval'
    long: 'long'
    square: 'square'
  sizes:
    rai: 'tiny, like a mustard seed'
    dal: 'small, like a dal grain'
    matar: 'the size of a pea'
    badam: 'the size of an almond'
    bigger: 'bigger than an almond'
  markings:
    plain: ''
    line: 'with a line in the middle'
    letters: 'with letters on it'
    unknown: ''
  food:
    before: 'Before food'
    after: 'After food'
    with: 'With food'
    any: ''
  kinds:
    tablet: 'tablet'
    capsule: 'capsule'
    syrup: 'syrup'
    other: 'medicine'
  ordinals: ['First medicine', 'Second medicine', 'Third medicine', 'Fourth medicine', 'Fifth medicine', 'Sixth medicine', 'Seventh medicine', 'Eighth medicine', 'Ninth medicine', 'Tenth medicine']
  counts: ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten']

# Reply phrases. Matching is whole-word. Order of checks (README): stop, doctor_changed,
# unwell, repeat, snooze, negative, and confirm LAST. Unclear speech is never a confirmation.
replies:
  confirm: ['taken', 'i took it', 'took it', 'i have taken', 'i have taken it', 'yes', 'yes taken', 'done', 'ok taken', 'le li', 'haan']
  # "Not taken". Also words for "ran out" / "finished": they must never count as taken.
  negative: ['no', 'not taken', 'not yet', 'did not take', 'didnt take', 'didn t take', 'have not taken', 'haven t taken', 'havent taken', 'ran out', 'finished', 'over', 'nahi']
  snooze: ['later', 'after some time', 'in some time', 'remind me later', 'wait', 'baad mein']
  repeat: ['repeat', 'again', 'say again', 'once more', 'what', 'pardon', 'did not understand', 'didn t understand', 'didnt understand']
  doctor_changed: ['doctor changed', 'doctor changed it', 'doctor changed the medicine', 'medicine changed', 'doctor stopped it']
  unwell: ['not feeling well', 'i am unwell', 'unwell', 'feeling sick', 'i am sick']
  stop: ['stop', 'stop calling', 'stop the calls', 'do not call', 'don t call', 'dont call']
  consent_yes: ['yes', 'yes please', 'okay', 'ok', 'sure', 'haan']
  consent_no: ['no', 'no thanks', 'do not want', 'don t want', 'dont want', 'nahi']
